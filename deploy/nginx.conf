server {
    server_name fullscope-media.com www.fullscope-media.com 107.172.143.169;

    if ($host = www.fullscope-media.com) {
        return 301 https://fullscope-media.com$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/fullscope-media.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fullscope-media.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.fullscope-media.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = fullscope-media.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name fullscope-media.com www.fullscope-media.com 107.172.143.169;
    return 404; # managed by Certbot




}